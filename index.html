<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liquid Glass - Working Blur</title>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .liquid-glass {
      width: 100%;
      height: 100%;
      box-sizing: border-box;

      appearance: none;
      -webkit-appearance: none;
      outline: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;

      /* Rounded corners */
      border-radius: 24px;
      overflow: hidden;

      /* WEBKIT MASK FIX FOR ADALO (Prevents square gray artifacts) */
      -webkit-mask-image: -webkit-radial-gradient(white, black);

      /* CLEAR GLASS BASE (Very light tint so it doesn't look milky/frosted) */
      background: rgba(255, 255, 255, 0.08);

      /* NATIVE WEBVIEW BACKDROP BLUR (guaranteed to render cleanly in iOS/Adalo) */
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);

      /* SVG REFRACTION WARP (Applied directly to the element filter stack) */
      filter: url(#liquid-glass-distortion);
      -webkit-filter: url(#liquid-glass-distortion);

      /* Rim highlight border */
      border: 1px solid rgba(255, 255, 255, 0.2);

      /* Specular rim lighting */
      box-shadow: 
        inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.4),
        0 8px 24px rgba(0, 0, 0, 0.25);

      transition: transform 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .liquid-glass:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <!-- Hidden SVG Distortion Filter -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="1" seed="42" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="0.8" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="18" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <button class="liquid-glass" type="button" onclick="buttonPressed()"></button>

  <script>
    function buttonPressed() {
      // Action logic here
    }
  </script>
</body>
</html>
