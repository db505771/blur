<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liquid Glass Theme Switcher Button</title>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
    }

    .liquid-glass-pure {
      width: 100%;
      height: 100%;
      box-sizing: border-box;

      appearance: none;
      -webkit-appearance: none;
      outline: none;
      padding: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;

      /* Smooth rounded corners */
      border-radius: 28px;
      overflow: hidden;

      /* FIX FOR DARK CORNER EDGES: Clips the WebView rendering cleanly inside the radius */
      -webkit-mask-image: -webkit-radial-gradient(white, black);

      /* LIQUID GLASS SURFACE: Pure light sheen, no dark/black tint layer */
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.28) 0%,
        rgba(255, 255, 255, 0.08) 45%,
        rgba(255, 255, 255, 0.15) 100%
      );

      /* Native Backdrop Blur + High Saturation */
      backdrop-filter: blur(25px) saturate(210%);
      -webkit-backdrop-filter: blur(25px) saturate(210%);

      /* NO borders or strokes that create dark outlines */
      border: none;

      /* Soft specular edge highlights (white glow instead of dark shadows) */
      box-shadow: 
        inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.5),
        inset 0 -1px 2px 0 rgba(255, 255, 255, 0.2),
        0 8px 24px rgba(0, 0, 0, 0.12);

      /* Touch Feedback */
      transition: transform 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .liquid-glass-pure:active {
      transform: scale(0.98);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.38) 0%,
        rgba(255, 255, 255, 0.18) 100%
      );
    }

    /* Switcher Options inside the button */
    .switcher__legend {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .switcher__option {
      --c: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .switcher__input {
      position: absolute;
      opacity: 0.01;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .switcher__icon {
      width: 22px;
      height: 22px;
      pointer-events: none;
      transition: fill 0.2s ease;
    }

    /* Active State Styling */
    .switcher__input:checked + .switcher__icon {
      --c: #ffffff;
    }

    .switcher__option:has(.switcher__input:checked) {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <button class="liquid-glass-pure" type="button">
    <legend class="switcher__legend">Choose theme</legend>
    
    <!-- Light Option -->
    <label class="switcher__option" onclick="event.stopPropagation()">
      <input class="switcher__input" type="radio" name="theme" value="light" checked />
      <svg class="switcher__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 36 36">
        <path fill="var(--c)" fill-rule="evenodd" d="M18 12a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" clip-rule="evenodd"/>
        <path fill="var(--c)" d="M17 6.038a1 1 0 1 1 2 0v3a1 1 0 0 1-2 0v-3ZM24.244 7.742a1 1 0 1 1 1.618 1.176L24.1 11.345a1 1 0 1 1-1.618-1.176l1.763-2.427ZM29.104 13.379a1 1 0 0 1 .618 1.902l-2.854.927a1 1 0 1 1-.618-1.902l2.854-.927ZM29.722 20.795a1 1 0 0 1-.619 1.902l-2.853-.927a1 1 0 1 1 .618-1.902l2.854.927ZM25.862 27.159a1 1 0 0 1-1.618 1.175l-1.763-2.427a1 1 0 1 1 1.618-1.175l1.763 2.427ZM19 30.038a1 1 0 0 1-2 0v-3a1 1 0 1 1 2 0v3ZM11.755 28.334a1 1 0 0 1-1.618-1.175l1.764-2.427a1 1 0 1 1 1.618 1.175l-1.764 2.427ZM6.896 22.697a1 1 0 1 1-.618-1.902l2.853-.927a1 1 0 1 1 .618 1.902l-2.853.927ZM6.278 15.28a1 1 0 1 1 .618-1.901l2.853.927a1 1 0 1 1-.618 1.902l-2.853-.927ZM10.137 8.918a1 1 0 0 1 1.618-1.176l1.764 2.427a1 1 0 0 1-1.618 1.176l-1.764-2.427Z"/>
      </svg>
    </label>

    <!-- Dark Option -->
    <label class="switcher__option" onclick="event.stopPropagation()">
      <input class="switcher__input" type="radio" name="theme" value="dark" />
      <svg class="switcher__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 36 36">
        <path fill="var(--c)" d="M12.5 8.473a10.968 10.968 0 0 1 8.785-.97 7.435 7.435 0 0 0-3.737 4.672l-.09.373A7.454 7.454 0 0 0 28.732 20.4a10.97 10.97 0 0 1-5.232 7.125l-.497.27c-5.014 2.566-11.175.916-14.234-3.813l-.295-.483C5.53 18.403 7.13 11.93 12.017 8.77l.483-.297Zm4.234.616a8.946 8.946 0 0 0-2.805.883l-.429.234A9 9 0 0 0 10.206 22.5l.241.395A9 9 0 0 0 22.5 25.794l.416-.255a8.94 8.94 0 0 0 2.167-1.99 9.433 9.433 0 0 1-2.782-.313c-5.043-1.352-8.036-6.535-6.686-11.578l.147-.491c.242-.745.573-1.44.972-2.078Z"/>
      </svg>
    </label>
  </button>

</body>
</html>
