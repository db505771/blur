<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abdughafur - Liquid Glass Distortion</title>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
    }

    .liquid-glass {
      width: 100%;
      height: 100%;
      box-sizing: border-box;

      appearance: none;
      -webkit-appearance: none;
      outline: none;
      padding: 0;
      margin: 0;
      display: block;
      cursor: pointer;

      /* Smooth rounded corners */
      border-radius: 28px;
      overflow: hidden;

      /* WebKit Mask Clip for Adalo WebViews */
      -webkit-mask-image: -webkit-radial-gradient(white, black);

      /* LIQUID GLASS SURFACE */
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.28) 0%,
        rgba(255, 255, 255, 0.08) 45%,
        rgba(255, 255, 255, 0.15) 100%
      );

      /* Native Backdrop Blur + SVG Liquid Refraction Filter */
      backdrop-filter: url(#liquid-glass-distortion) blur(25px) saturate(210%);
      -webkit-backdrop-filter: url(#liquid-glass-distortion) blur(25px) saturate(210%);

      border: none;

      /* Specular rim lighting and specular glow */
      box-shadow: 
        inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.5),
        inset 0 -1px 2px 0 rgba(255, 255, 255, 0.2),
        0 8px 24px rgba(0, 0, 0, 0.12);

      /* Touch Feedback */
      transition: transform 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .liquid-glass:active {
      transform: scale(0.98);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.38) 0%,
        rgba(255, 255, 255, 0.18) 100%
      );
    }
  </style>
</head>
<body>

  <!-- Hidden SVG Distortion Filter Definition -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="92" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="85" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- Interactive Liquid Glass Component Button -->
  <button class="liquid-glass" id="glass-card" type="button" onclick="buttonPressed()"></button>

  <script>
    function buttonPressed() {
      // Action logic here
    }
  </script>
</body>
</html>
