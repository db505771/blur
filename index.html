<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deep Purple App Panel</title>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-card {
      width: 100%;
      height: 100%;
      box-sizing: border-box;

      appearance: none;
      -webkit-appearance: none;
      outline: none;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;

      /* Rounded corners matching modern app UI */
      border-radius: 24px;
      overflow: hidden;

      /* WebKit Mask Clip for Adalo WebViews */
      -webkit-mask-image: -webkit-radial-gradient(white, black);

      /* Deep Purple Translucent Glass Base */
      background: rgba(45, 20, 75, 0.45);

      /* Optical Blur + SVG Water/Lens Refraction */
      backdrop-filter: url(#liquid-glass-distortion) blur(14px) saturate(180%);
      -webkit-backdrop-filter: url(#liquid-glass-distortion) blur(14px) saturate(180%);

      /* Thin violet-tinted rim highlight */
      border: 1px solid rgba(190, 140, 255, 0.2);

      /* Deep shadow and inner specular top highlight */
      box-shadow: 
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.3),
        0 10px 30px rgba(15, 5, 30, 0.4);

      color: #ffffff;
      transition: transform 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .app-card:active {
      transform: scale(0.98);
      background: rgba(55, 25, 90, 0.6);
    }

    .card-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 4px;
    }

    .card-metric {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Hidden SVG Distortion Filter for Clean Optical Warp -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.015" numOctaves="2" seed="42" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="1" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="30" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <button class="app-card" type="button" onclick="buttonPressed()">
    <div class="card-title">Total Time</div>
    <div class="card-metric">1010h 3m</div>
  </button>

  <script>
    function buttonPressed() {
      // Action logic here
    }
  </script>
</body>
</html>
