<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Optical Liquid Glass</title>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
    }

    .liquid-glass {
      width: 100%;
      height: 100%;
      box-sizing: border-box;

      appearance: none;
      -webkit-appearance: none;
      outline: none;
      padding: 0;
      margin: 0;
      display: block;
      cursor: pointer;

      /* Smooth rounded corners */
      border-radius: 28px;
      overflow: hidden;

      /* WebKit Mask Clip for Adalo WebViews */
      -webkit-mask-image: -webkit-radial-gradient(white, black);

      /* OPTICAL CLEAR GLASS: Very low background tint so it doesn't look milky/frosted */
      background: rgba(255, 255, 255, 0.04);

      /* OPTICAL BLUR + SVG DISTORTION: 
         This warps and bends the background imagery like a physical lens 
         rather than spreading a milky white matte filter over it. */
      backdrop-filter: url(#liquid-glass-distortion) blur(12px) saturate(180%);
      -webkit-backdrop-filter: url(#liquid-glass-distortion) blur(12px) saturate(180%);

      border: none;

      /* Sharp specular highlights to define the glass edge */
      box-shadow: 
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -1px 1px 0 rgba(255, 255, 255, 0.15),
        0 8px 24px rgba(0, 0, 0, 0.2);

      /* Touch Feedback */
      transition: transform 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .liquid-glass:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>

  <!-- Optimized SVG Distortion Filter for Clean Optical Warp -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <!-- Fine turbulence to create water/lens ripples -->
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.015" numOctaves="2" seed="42" result="noise" />
        <!-- Low blur on the noise map so the warp lines stay sharp and defined -->
        <feGaussianBlur in="noise" stdDeviation="1" result="blurred" />
        <!-- Displacement map that physically shifts the background pixels -->
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="40" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <button class="liquid-glass" type="button" onclick="buttonPressed()"></button>

  <script>
    function buttonPressed() {
      // Action logic here
    }
  </script>
</body>
</html>
