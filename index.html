<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pure Liquid Glass - Black/White Outlines</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .liquid-glass-pure {
      position: relative;
      width: 100%;
      height: 100%;

      appearance: none;
      -webkit-appearance: none;
      outline: none;
      padding: 0;
      margin: 0;
      display: block;
      cursor: pointer;

      /* Smooth rounded corners */
      border-radius: 28px;
      clip-path: inset(0 round 28px);

      /* LIQUID GLASS SURFACE */
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.32) 0%,
        rgba(255, 255, 255, 0.06) 40%,
        rgba(255, 255, 255, 0.18) 100%
      );

      /* Backdrop blur & saturation boost */
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);

      /* Standard ambient drop shadow (no edge borders in box-shadow) */
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12);

      /* Smooth touch performance */
      will-change: transform, background;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  background 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    /* Directional Outline Layer: Top/Bottom = White, Left/Right = Black */
    .liquid-glass-pure::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      pointer-events: none;

      /* 1.5px border outline */
      border-style: solid;
      border-width: 1.5px;

      /* Top & Bottom: White | Right & Left: Black */
      border-color: rgba(255, 255, 255, 0.85) rgba(0, 0, 0, 0.75) rgba(255, 255, 255, 0.6) rgba(0, 0, 0, 0.75);

      /* Inner soft glow for realistic glass rimming */
      box-shadow: 
        inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 2px 0 rgba(255, 255, 255, 0.2);
    }

    /* Active Touch State */
    .liquid-glass-pure:active {
      transform: scale(0.97);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.42) 0%,
        rgba(255, 255, 255, 0.15) 100%
      );
    }
  </style>
</head>
<body>

  <button class="liquid-glass-pure" type="button"></button>

</body>
</html>
